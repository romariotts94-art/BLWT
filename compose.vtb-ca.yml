# Attach the Ministry of Digital Development CA chain to the main Node app.
# The file contains public CA certificates, not a merchant private key.
services:
  app:
    environment:
      NODE_EXTRA_CA_CERTS: /app/private/vtb-ca-bundle.pem
    volumes:
      - type: bind
        source: ${VTB_CA_BUNDLE_PATH:?Set VTB_CA_BUNDLE_PATH in the private .env file}
        target: /app/private/vtb-ca-bundle.pem
        read_only: true

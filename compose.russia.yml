services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blwt
      POSTGRES_USER: blwt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blwt -d blwt"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://blwt:${POSTGRES_PASSWORD}@db:5432/blwt
      FILE_STORAGE_PATH: /app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  support-delivery:
    image: black-and-white-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://blwt:${POSTGRES_PASSWORD}@db:5432/blwt
    command: ["node", "scripts/support-delivery.mjs"]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/black-and-white:ro
      - caddy_data:/data
      - caddy_config:/config

  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command:
      - turnserver
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USERNAME:?Set TURN_USERNAME in the private .env file}:${TURN_CREDENTIAL:?Set TURN_CREDENTIAL in the private .env file}
      - --realm=${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in the private .env file}
      - --external-ip=${PUBLIC_IP:?Set PUBLIC_IP in the private .env file}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:

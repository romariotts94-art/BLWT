name: blwt-vtb-stage

# Isolated RBS sandbox. Never point this stack at the production PostgreSQL volume.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blwt_vtb_qa
      POSTGRES_USER: blwt_vtb
      POSTGRES_PASSWORD: ${VTB_STAGE_POSTGRES_PASSWORD:?Set VTB_STAGE_POSTGRES_PASSWORD in the private stage env file}
    volumes:
      - stage_postgres_data:/var/lib/postgresql/data
    networks:
      - stage_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blwt_vtb -d blwt_vtb_qa"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 0.5

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "1000"
    volumes:
      - stage_mailpit_data:/data
    ports:
      - "127.0.0.1:${VTB_STAGE_MAIL_UI_PORT:-8026}:8025"
    networks:
      - stage_private
      - stage_mail_ui
    mem_limit: 128m
    cpus: 0.25

  app:
    image: blwt-vtb-stage-app:${VTB_STAGE_IMAGE_TAG:-local}
    build:
      context: .
      args:
        RELEASE_SHA: ${VTB_STAGE_RELEASE_SHA:-uncommitted-stage}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_ORIGIN: ${VTB_STAGE_PUBLIC_ORIGIN:-http://127.0.0.1:5176}
      DATABASE_URL: ${VTB_STAGE_DATABASE_URL:?Set VTB_STAGE_DATABASE_URL for the isolated stage database}
      PG_SSL: "false"
      AUTH_SECRET: ${VTB_STAGE_AUTH_SECRET:?Set VTB_STAGE_AUTH_SECRET in the private stage env file}
      ADMIN_EMAILS: ${VTB_STAGE_ADMIN_EMAIL:?Set VTB_STAGE_ADMIN_EMAIL to a synthetic stage-only address}
      OWNER_EMAILS: ${VTB_STAGE_ADMIN_EMAIL:?Set VTB_STAGE_ADMIN_EMAIL to a synthetic stage-only address}
      FILE_STORAGE_PATH: /app/data/uploads
      BANK_RECONCILIATION_ENABLED: "false"
      VTB_SANDBOX_ENABLED: "true"
      VTB_SANDBOX_USER_NAME: ${VTB_STAGE_USER_NAME:?Set VTB_STAGE_USER_NAME in the private stage env file}
      VTB_SANDBOX_PASSWORD: ${VTB_STAGE_PASSWORD:?Set VTB_STAGE_PASSWORD in the private stage env file}
      VTB_SANDBOX_RETURN_ORIGIN: ${VTB_STAGE_RETURN_ORIGIN:-http://127.0.0.1:5176}
      NODE_EXTRA_CA_CERTS: /app/private/vtb-ca-bundle.pem
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      AUTH_FROM: Black and White Test <no-reply@blacktowhite.invalid>
      QWEN_ENABLED: "0"
      TELEGRAM_BOT_TOKEN: ""
      TRUST_DEMO_ENABLED: "false"
      DEMO_LOGIN_ENABLED: "false"
    volumes:
      - stage_uploads:/app/data/uploads
      - type: bind
        source: ${VTB_STAGE_CA_BUNDLE_PATH:?Set VTB_STAGE_CA_BUNDLE_PATH to the private CA bundle}
        target: /app/private/vtb-ca-bundle.pem
        read_only: true
    ports:
      - "127.0.0.1:${VTB_STAGE_PORT:-5176}:3000"
    networks:
      - stage_private
      - stage_bank_egress
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0

  migrate:
    image: blwt-vtb-stage-app:${VTB_STAGE_IMAGE_TAG:-local}
    command: ["node", "scripts/migrate-postgres.mjs"]
    environment:
      DATABASE_URL: ${VTB_STAGE_DATABASE_URL:?Set VTB_STAGE_DATABASE_URL for the isolated stage database}
      PG_SSL: "false"
    networks:
      - stage_private
    depends_on:
      db:
        condition: service_healthy
    profiles: ["ops"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  stage_private:
    internal: true
  stage_bank_egress:
  stage_mail_ui:

volumes:
  stage_postgres_data:
  stage_uploads:
  stage_mailpit_data:
